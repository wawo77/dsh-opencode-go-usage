# dsh-opencode-go-usage bundle patch: inserts its plugin row into the web
# plugin roster. The single row mounts BOTH halves — the host side (credential
# resolution, the OpenCode Go usage probe, the local call ledger, the
# loopback-fenced JSON routes) and the browser side (the floating ring and its
# expandable quota card, served from this package's lib/client.js).
- insert:
    - id: opencode-go-usage
      name: 'dsh-opencode-go-usage'
